<!--
  VRM Monitor invite / activation email — PLAN_PHASE14.md §1.9, §2 Step 7.

  Table-layout HTML + inline styles only, no <style> block, no external CSS,
  no `data:` URIs — Gmail (and several other webmail clients) strips <style>
  blocks and refuses to fetch external stylesheets, and clipping/blocking a
  data: URI image is a documented Gmail behaviour, not a hypothetical one.
  Every rule that matters is inlined on the element it applies to, and
  layout uses nested <table> the way HTML email has always had to (flexbox/
  grid support across mail clients is still unreliable in 2026 the way it
  wasn't ever a real constraint for a browser-rendered page).

  Jinja2 variables (rendered by lib/server/invites.ts's own render step in
  the TypeScript-side flow this repo actually ships — see that file's
  header comment for why; this template is Phase 14's own deliverable and
  Phase 12's future source of truth for the *visual* design, kept here so
  the two don't silently diverge even though they're rendered by different
  processes today):

    heading      -- e.g. "Activate your VRM Monitor account"
    intro        -- one or two sentences of plain-text body copy
    cta_label    -- button text, e.g. "Set your password"
    cta_url      -- the {SITE_URL}/activate?token_hash=...&type=... link
    footer_note  -- small print under the button (expiry / who to contact)

  Brand colour: #0789d4, the shipped --victron token
  (victron-monitor/web/styles/tokens.css) — not the older #0089B6 RAL 5012
  placeholder PLAN_PHASE14.md §1.8 floated before Oscar picked a swatch.
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ heading }}</title>
  </head>
  <body style="margin:0; padding:0; background-color:#0b2231; font-family:Helvetica, Arial, sans-serif;">
    <!-- Preheader: hidden, but shows in the inbox preview line. -->
    <div style="display:none; max-height:0; overflow:hidden; opacity:0;">{{ intro }}</div>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
           style="background-color:#0b2231;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" border="0"
                 style="width:480px; max-width:100%; background-color:#12324a; border-radius:8px; overflow:hidden;">
            <tr>
              <td style="padding:28px 32px 0 32px;">
                <span style="display:inline-block; font-family:Helvetica, Arial, sans-serif; font-weight:800;
                             text-transform:uppercase; letter-spacing:1px; font-size:13px; color:#e9f2f6;">
                  Pauly &amp; Co. &middot; VRM Monitor
                </span>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 32px 0 32px; border-top:1px solid #234a63; margin-top:20px;">
                &nbsp;
              </td>
            </tr>
            <tr>
              <td style="padding:8px 32px 0 32px;">
                <h1 style="margin:0 0 16px 0; font-family:Helvetica, Arial, sans-serif; font-size:20px;
                           line-height:1.3; color:#e9f2f6;">
                  {{ heading }}
                </h1>
                <p style="margin:0 0 24px 0; font-family:Helvetica, Arial, sans-serif; font-size:14px;
                          line-height:1.6; color:#afc7d4;">
                  {{ intro }}
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 8px 32px;">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td align="center" bgcolor="#0789d4" style="border-radius:4px;">
                      <a href="{{ cta_url }}"
                         style="display:inline-block; padding:12px 28px; font-family:Helvetica, Arial, sans-serif;
                                font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px;
                                color:#ffffff; text-decoration:none; border-radius:4px;">
                        {{ cta_label }}
                      </a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 32px 8px 32px;">
                <p style="margin:0; font-family:Helvetica, Arial, sans-serif; font-size:12px; line-height:1.6;
                          color:#6f93a6;">
                  {{ footer_note }}
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 32px 0 32px;">
                <p style="margin:0; font-family:Helvetica, Arial, sans-serif; font-size:11px; line-height:1.6;
                          color:#6f93a6; word-break:break-all;">
                  If the button above doesn't work, copy and paste this link:<br />
                  <a href="{{ cta_url }}" style="color:#4fc8ec;">{{ cta_url }}</a>
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 32px 28px 32px;">
                <p style="margin:0; font-family:Helvetica, Arial, sans-serif; font-size:11px; color:#6f93a6;">
                  &copy; Pauly &amp; Co. Solar
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
