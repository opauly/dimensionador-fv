{# Reveal-on-demand credentials fragment (§0.4 Q3 / §1.6) — swapped into
   #cred-<schema>-<site_id> by the "Ver / editar credenciales" toggle
   (GET, hx-trigger="click once") and by this same form's own save (POST).
   Port of _detail_section()'s per-site cred_form (item 23). #}
<form hx-post="{{ url_for('maintenance.propiedad_credenciales_guardar', pid=pid) }}"
      hx-target="#cred-{{ schema_name }}-{{ site_id }}" hx-swap="innerHTML">
  <input type="hidden" name="site_id" value="{{ site_id }}">
  <input type="hidden" name="schema_name" value="{{ schema_name }}">
  {% if error %}<p style="color:#B84345;font-size:12.5px;">{{ error }}</p>{% endif %}
  <div style="margin-top:8px;">
    <label class="flabel">Credenciales (WiFi, portal, etc.)</label>
    <textarea class="finput" name="credentials" rows="2">{{ credentials }}</textarea>
  </div>
  <div style="margin-top:8px;">
    <label class="flabel">Notas</label>
    <textarea class="finput" name="notes" rows="2">{{ notes }}</textarea>
  </div>
  <div style="margin-top:8px;">
    <button class="btn" type="submit">Guardar credenciales</button>
  </div>
</form>
