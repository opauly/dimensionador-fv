{% extends "wizard/shell.html" %}
{% block wizard_body %}
<form method="post" action="{{ url_for('wizard.paso_post', vid=vid, n=5) }}" id="s5-form">
  <label class="flabel">Fuente del historial de consumo</label>
  <div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:8px;">
    {% for value, label in source_options %}
    <label style="display:flex;align-items:center;gap:6px;font-size:13px;padding:6px 10px;border:1px solid var(--border);border-radius:6px;">
      <input type="radio" name="source" value="{{ value }}" {{ 'checked' if value == source else '' }}
             hx-post="{{ url_for('wizard.paso5_fuente', vid=vid) }}" hx-target="#s5-consumo" hx-swap="outerHTML">
      {{ label }}
    </label>
    {% endfor %}
  </div>

  {% include "wizard/_s5_consumo.html" %}

  <div class="fgrid" style="margin-top:16px;max-width:340px;">
    <div>
      <label class="flabel">Costo del permiso de interconexión (USD)</label>
      <input class="finput" type="number" min="0" step="100" name="icpe_usd" value="{{ icpe_usd }}">
    </div>
  </div>

  <div class="wiz-nav">
    <button class="btn btn-outline" type="submit" formaction="{{ url_for('wizard.paso_atras', vid=vid, n=5) }}">← Atrás</button>
    <button class="btn" type="submit" {{ 'disabled' if not can_continue else '' }}>Siguiente →</button>
  </div>
  {% if not can_continue %}<p class="wiz-note">Ingresa al menos un mes de consumo para continuar.</p>{% endif %}
</form>
{% endblock %}
