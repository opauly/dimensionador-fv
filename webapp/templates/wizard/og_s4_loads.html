{% extends "wizard/shell.html" %}
{% block wizard_body %}
<form method="post" action="{{ url_for('wizard.paso_post', vid=vid, n=4) }}" id="s4og-form">
  <div class="fgrid">
    <div>
      <label class="flabel">Voltaje de salida requerido</label>
      <div style="display:flex;gap:14px;margin-top:6px;">
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;">
          <input type="radio" name="voltage" value="120" {{ 'checked' if voltage_v != 240 else '' }}> 120V
        </label>
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;">
          <input type="radio" name="voltage" value="240" {{ 'checked' if voltage_v == 240 else '' }}> 120/240V (split-phase)
        </label>
      </div>
    </div>
  </div>

  <hr>
  <h4 class="section-title" style="font-size:15px;">Cargas eléctricas</h4>
  {% include "wizard/_s4og_cargas.html" %}

  <div class="wiz-nav">
    <button class="btn btn-outline" type="submit" formaction="{{ url_for('wizard.paso_atras', vid=vid, n=4) }}">← Atrás</button>
    <button class="btn" type="submit" {{ 'disabled' if not can_continue else '' }}>Siguiente →</button>
  </div>
  {% if not can_continue %}<p class="wiz-note">Agrega al menos una carga para continuar.</p>{% endif %}
</form>
{% endblock %}
