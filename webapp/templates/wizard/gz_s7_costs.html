{% extends "wizard/shell.html" %}
{% block wizard_body %}
<form method="post" action="{{ url_for('wizard.paso_post', vid=vid, n=n) }}" id="s7-form">
  {% include "wizard/_s7_costos.html" %}

  {% if error %}<p class="wiz-error">{{ error }}</p>{% endif %}

  <div class="wiz-nav">
    <button class="btn btn-outline" type="submit" formaction="{{ url_for('wizard.paso_atras', vid=vid, n=n) }}">← Atrás</button>
    <button id="wiz-next" class="btn" type="submit" {{ 'disabled' if not can_continue else '' }}>Siguiente →</button>
  </div>
  <p id="wiz-next-note" class="wiz-note" {{ 'hidden' if can_continue else '' }}>Agrega al menos una línea con costo para continuar.</p>
</form>
{% endblock %}
