{% extends "wizard/shell.html" %}
{% block wizard_body %}
<form method="post" action="{{ url_for('wizard.paso_post', vid=vid, n=4) }}" id="s4-form">
  <div class="fgrid">
    <div>
      <label class="flabel">Distribuidora *</label>
      <select class="finput" name="distributor_id"
              hx-get="{{ url_for('wizard.paso4_distribuidor', vid=vid) }}"
              hx-trigger="change" hx-target="#s4-tarifa" hx-swap="outerHTML">
        {% for d in distributors %}
          <option value="{{ d.id }}" {{ 'selected' if d.id == selected_dist_id else '' }}>{{ d.abbreviation }} — {{ d.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="flabel">NISE (número de cliente)</label>
      <input class="finput" type="text" name="nise" value="{{ nise }}">
    </div>
  </div>

  <div class="fgrid" style="margin-top:12px;">
    <div>
      <label class="flabel">Servicio eléctrico</label>
      <select class="finput" name="service_phases" id="svc-phases"
              onchange="document.getElementById('svc-3f').style.display = this.value === '3' ? '' : 'none'">
        <option value="1" {{ 'selected' if service.phases != 3 else '' }}>Monofásico (120/240 V)</option>
        <option value="3" {{ 'selected' if service.phases == 3 else '' }}>Trifásico</option>
      </select>
    </div>
  </div>
  <div id="svc-3f" class="fgrid" style="{{ '' if service.phases == 3 else 'display:none;' }}margin-top:8px;">
    <div>
      <label class="flabel">Voltaje entre fases (V)</label>
      <select class="finput" name="service_v_ll">
        {% for v in v_ll_options %}<option value="{{ v|int }}" {{ 'selected' if v == service.v_ll else '' }}>{{ v|int }} V</option>{% endfor %}
      </select>
    </div>
    <div>
      <label class="flabel">Planta de referencia (perfil de carga medido)</label>
      <select class="finput" name="profile_site_id">
        {% for r in reference_sites %}<option value="{{ r.site_id }}" {{ 'selected' if r.site_id == service.profile_site_id else '' }}>{{ r.name }}</option>{% endfor %}
        {% if not reference_sites %}<option value="">(sin plantas de referencia)</option>{% endif %}
      </select>
    </div>
  </div>

  {% include "wizard/_s4_tarifa.html" %}

  {% if error %}<p class="wiz-error">{{ error }}</p>{% endif %}

  <div class="wiz-nav">
    <button class="btn btn-outline" type="submit" formaction="{{ url_for('wizard.paso_atras', vid=vid, n=4) }}">← Atrás</button>
    <button id="wiz-next" class="btn" type="submit" {{ 'disabled' if not can_continue else '' }}>Siguiente →</button>
  </div>
</form>
{% endblock %}
