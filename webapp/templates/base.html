<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{% block title %}Pauly&amp;Co Solar Tool{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
<script src="{{ url_for('static', filename='vendor/htmx.min.js') }}" defer></script>
<!-- Not deferred: wizard step pages embed a plain, non-deferred <script>Plotly.newPlot(...)</script>
     directly in the body (via Plotly's own fig.to_html() export). A deferred script runs only after
     the whole document has parsed, which is always AFTER any earlier inline <script> in the body --
     so on a fresh full-page load (e.g. revisiting a wizard step that already has a computed chart,
     as opposed to reaching it via an htmx-triggered "Calcular" action after the page has long since
     loaded), `Plotly` would be undefined when that inline script runs. Loading this one synchronously
     guarantees `Plotly` exists before any body content, inline chart script included, is parsed. -->
<script src="{{ url_for('static', filename='vendor/plotly-basic.min.js') }}"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-name">Pauly&amp;Co</span>
      </div>
      <div class="db-status {{ 'ok' if db_ok else 'warn' }}">
        {{ '● Supabase conectado' if db_ok else 'Supabase no conectado' }}
      </div>
      <nav class="nav">
        <a href="{{ url_for('dashboard.index') }}" class="{{ 'active' if request.endpoint == 'dashboard.index' else '' }}">Panel de Control</a>
        <a href="{{ url_for('proposals.index') }}" class="{{ 'active' if request.blueprint in ('proposals', 'wizard') else '' }}">Cotizaciones</a>
        <a href="{{ url_for('projects.index') }}" class="{{ 'active' if request.blueprint == 'projects' else '' }}">Proyectos</a>
        <a href="{{ url_for('admin.index', section='equipos') }}" class="{{ 'active' if request.blueprint == 'admin' else '' }}">Admin</a>
        <a href="{{ url_for('maintenance.index') }}" class="{{ 'active' if request.blueprint == 'maintenance' else '' }}">Mantenimiento</a>
      </nav>
    </aside>

    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>

  <div id="flash"></div>
  <script>
    document.body.addEventListener("htmx:afterRequest", (e) => {
      const verb = (e.detail.requestConfig?.verb || "get").toLowerCase();
      if (verb === "get") return;
      const flash = document.getElementById("flash");
      flash.textContent = e.detail.successful ? "Guardado" : "Algo salió mal — recargue e intente de nuevo";
      flash.classList.add("show");
      clearTimeout(window.__flashTimer);
      window.__flashTimer = setTimeout(() => flash.classList.remove("show"), 1400);
    });
  </script>
</body>
</html>
