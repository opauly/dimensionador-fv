{# «Ver» menu — a small modal fragment appended to <body> by htmx (hx-target="body" hx-swap="beforeend"). It removes itself on close. #}
<div class="dm-back" onclick="if(event.target===this)this.remove()">
<style>
.dm-back { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: flex; align-items: center; justify-content: center; z-index: 1000; }
.dm-box { background: #fff; border-radius: 14px; width: min(460px, calc(100vw - 32px)); padding: 18px 18px 14px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
.dm-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
.dm-title { font-size: 16px; font-weight: 700; color: var(--navy); }
.dm-sub { font-size: 12px; color: var(--muted-2); margin-top: 2px; }
.dm-x { border: 0; background: none; font-size: 20px; line-height: 1; cursor: pointer; color: var(--muted-2); }
.dm-item { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; margin-top: 8px; text-decoration: none; color: var(--navy); }
.dm-item:hover { border-color: var(--navy); background: #f8fafc; }
.dm-item.off { opacity: .45; pointer-events: none; }
.dm-ico { font-size: 20px; width: 26px; text-align: center; }
.dm-it { font-size: 13.5px; font-weight: 600; }
.dm-is { font-size: 11.5px; color: var(--muted-2); margin-top: 1px; }
.dm-note { font-size: 11.5px; color: var(--muted-2); margin: 10px 2px 0; }
</style>
<div class="dm-box" role="dialog" aria-modal="true">
  <div class="dm-head">
    <div><div class="dm-title">{{ title }}</div><div class="dm-sub">{{ client }}</div></div>
    <button class="dm-x" type="button" aria-label="Cerrar" onclick="this.closest('.dm-back').remove()">×</button>
  </div>
  {% for it in items %}
    <a class="dm-item{{ '' if it.href else ' off' }}" {% if it.href %}href="{{ it.href }}"{% if it.new_tab %} target="_blank" rel="noopener"{% endif %}{% endif %}>
      <span class="dm-ico">{{ it.icon }}</span>
      <span><div class="dm-it">{{ it.title }}</div><div class="dm-is">{{ it.sub }}</div></span>
    </a>
  {% endfor %}
  {% if note %}<p class="dm-note">{{ note }}</p>{% endif %}
</div>
</div>
